    trustStatus: market.trustStatus || 'trusted_live',
    platform: market.platform,
    book: market.bookTitle || market.platform,
    sourceEndpoint: proof.sourceEndpoint || null,
    sourceRequest: proof.sourceRequest || null,
    rawEventId: proof.rawEventId || null,
    rawBookmakerKey: proof.rawBookmakerKey || market.platform,
    rawBookmakerTitle: proof.rawBookmakerTitle || market.bookTitle || market.platform,
    rawMarketKey: proof.rawMarketKey || market.marketType || null,
    normalizedMarketType: proof.normalizedMarketType || market.marketType || null,
    rawOutcomeName: proof.rawOutcomeName || null,
    rawOutcomePrice: proof.rawOutcomePrice ?? null,
    rawOutcomePoint: proof.rawOutcomePoint ?? null,
    rawLastUpdate: proof.lastUpdate || null,
    lastUpdateAgeSeconds: proof.lastUpdateAgeSeconds ?? null,
    normalizationFunctionUsed: 'extractParlayStructure',
    normalizedGameKey: market.gameKey,
    normalizedMarketKey: [market.marketType, market.line ?? '', market.favoredTeam || '', market.player || '', market.statType || ''].join('|'),
    normalizedSide: proof.normalizedSide || side,
    normalizedAmerican: proof.normalizedAmerican ?? null,
    normalizedLine: market.line ?? proof.rawOutcomePoint ?? null,
    normalizedOdds: probToAmerican(normalizedProbability),
    normalizedProbability,
    rawCommenceTime: proof.rawCommenceTime || market.startTime || null,
    displayedDate: gameDate,
    lastUpdate: proof.lastUpdate || null,
    fetchTimestamp: proof.fetchTimestamp || null,
    cacheStatus: fromCache ? 'browser-cache' : (proof.cacheStatus || 'fresh'),
    dedupeKey,
    matchGroupKey,
    rawHomeTeam: proof.rawHomeTeam || market.home || null,
    rawAwayTeam: proof.rawAwayTeam || market.away || null
  };
}

function extractFliffStructure(m) {
  const { id, home, away, homeImplied, awayImplied, league, startTime } = m;
  if (!home || !away || !homeImplied || !awayImplied) return null;

  // Sport from league string e.g. "USA - NBA", "USA - MLB"
  const lg = (league || '').toUpperCase();
  let sport = 'other';
  if (lg.includes('NBA') || lg.includes('BASKETBALL')) sport = 'nba';
  else if (lg.includes('MLB') || lg.includes('BASEBALL')) sport = 'mlb';
  else if (lg.includes('NFL') || lg.includes('AMERICAN FOOTBALL')) sport = 'nfl';
  else if (lg.includes('NHL') || lg.includes('ICE HOCKEY')) sport = 'nhl';
  if (sport === 'other') return null;

  // Abbreviations for gameKey
  const homeAbbr = teamNameToAbbr(home);
  const awayAbbr = teamNameToAbbr(away);
  if (!homeAbbr || !awayAbbr) return null;

  // Date in ET (UTC-4) to match Polymarket convention
  const dateStr = startTime
    ? new Date(new Date(startTime) - 4 * 60 * 60 * 1000).toISOString().slice(0, 10)
    : null;
  if (!dateStr) return null;

  const gameKey = `${sport}-${awayAbbr}-${homeAbbr}-${dateStr}`;

  // Fliff moneyline: YES = away team wins (matches PM/Novig convention)
  const yesPrice = parseFloat(awayImplied.toFixed(4));  // away wins
  const noPrice  = parseFloat(homeImplied.toFixed(4));  // home wins

  if (yesPrice < 0.02 || yesPrice > 0.98) return null;
  if (noPrice  < 0.02 || noPrice  > 0.98) return null;

  return {
    id: 'fl_' + id,
    platform: 'fliff',
    rawTitle: away,   // YES side = away team
    noTitle:  home,   // NO side  = home team
    sport, gameKey,
    teams: [awayAbbr, homeAbbr],
    marketType: 'moneyline',
    line: null, player: null, statType: null,
    gameDate: dateStr,
    yesPrice, noPrice,
    url: 'https://sports.getfliff.com/',
    isLive: false,
  };
}

async function fetchFliff() {
  const data = await fetchRaw('/api/fliff');
  if (!Array.isArray(data)) return [];
  return data.map(m => extractFliffStructure(m)).filter(Boolean);
}


function extractParlayStructure(m, debug = null) {
  const home = m.home;
  const away = m.away;
  const platform = (m.platform || m.bookKey || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const marketType = m.marketType || 'moneyline';
  const lineType = m.lineType === 'alt' ? 'alt' : 'main';
  const sport = m.sport || 'other';
  const startTime = m.startTime || m.commence_time || '';
  if (!home || !away || !platform || sport === 'other') {
    noteParlayDrop(debug, 'missing_event_fields', m, { platform, sport });
    return null;
  }

  const homeAbbr = teamNameToAbbr(home, sport);
  const awayAbbr = teamNameToAbbr(away, sport);
  if (!homeAbbr || !awayAbbr) {
    noteParlayDrop(debug, 'missing_team_abbreviation', m, { homeAbbr, awayAbbr });
    return null;
  }

  const startMs = startTime ? new Date(startTime).getTime() : NaN;
  if (!Number.isFinite(startMs)) {
    noteParlayDrop(debug, 'missing_invalid_date', m, { startTime });
    return null;
  }
  const dateStr = new Date(startMs - 4 * 60 * 60 * 1000).toISOString().slice(0, 10);

  const gameKey = `${sport}-${awayAbbr}-${homeAbbr}-${dateStr}`;
  const matchGroupKey = [
    sport,
    startTime,
    awayAbbr,
    homeAbbr,
    marketType,
    lineType,
    m.line ?? '',
    m.player || '',
    m.statType || ''
  ].map(v => String(v || '').toLowerCase()).join('|');
  const yesPrice = Number(m.yesPrice);
  const noPrice = Number(m.noPrice);
  if (!Number.isFinite(yesPrice) || !Number.isFinite(noPrice) || !yesPrice || !noPrice) {
    noteParlayDrop(debug, 'missing_invalid_prices', m, { yesPrice, noPrice });
    return null;
  }
  if (yesPrice < 0.02 || yesPrice > 0.98 || noPrice < 0.02 || noPrice > 0.98) {
    noteParlayDrop(debug, 'price_out_of_range', m, { yesPrice, noPrice });
    return null;
  }

  let rawTitle = m.rawTitle || `${away} vs ${home}`;
  let noTitle = m.noTitle || rawTitle;
  let line = m.line == null ? null : Number(m.line);
  if (m.line != null && !Number.isFinite(line)) {
    noteParlayDrop(debug, 'missing_invalid_line', m, { line: m.line });
    return null;
  }

  // For spread matching, this is the team whose spread is being bet.
  // Example: "Spread: San Francisco 49ers (+3.5)" → sf.
  let favoredTeam = null;
  if (marketType === 'spread') {
    const spreadTeamMatch = rawTitle.match(/Spread:\s+(.+?)\s+\(/i);
    favoredTeam = spreadTeamMatch ? teamNameToAbbr(spreadTeamMatch[1], sport) : null;
    if (!favoredTeam) {
      noteParlayDrop(debug, 'missing_spread_team_abbreviation', m, { rawTitle });
      return null;
    }
  }

  const normalized = {
    id: `pa_${platform}_${m.id || `${awayAbbr}_${homeAbbr}_${marketType}_${line || 'ml'}`}`,
    platform,
    source: 'parlay',
    trustStatus: m.trustStatus || 'trusted_live',
    rawTitle,
    noTitle,
    sport,
    gameKey,
    teams: [awayAbbr, homeAbbr],
    marketType,
    lineType,
    line,
    favoredTeam,
    spreadSides: m.spreadSides || null,
    player: m.player || null,
    statType: m.statType || null,
    gameDate: dateStr,
    yesPrice,
    noPrice,
    rawPrice: m.rawYesPrice || null,
    rawNoPrice: m.rawNoPrice || null,
    exchangeDebug: platform === 'prophetx' ? {
      lastUpdate: m.exchangeLastUpdate || null,
      rawOverPrice: m.rawOverPrice ?? null,
      rawUnderPrice: m.rawUnderPrice ?? null,
      overAmerican: m.overAmerican ?? null,
      underAmerican: m.underAmerican ?? null,
      marketKey: m.marketKey || null,
      strike: m.line ?? null
    } : null,
    url: m.url || 'https://www.google.com/search?q=' + encodeURIComponent(`${PLAT_LB[platform] || platform} ${away} ${home} odds`),
    isLive: false,
  };
  const dedupeKey = [
    normalized.platform,
    normalized.sport,
    normalized.gameKey,
    normalized.marketType,
    normalized.lineType,
    normalized.line ?? '',
    normalized.favoredTeam || '',
    normalized.player || '',
    normalized.statType || ''
  ].map(v => String(v || '').toLowerCase()).join('|');
  normalized.dedupeKey = dedupeKey;
  normalized.matchGroupKey = matchGroupKey;
  normalized.sourceProof = {
    YES: enrichSourceProof(m.sourceProof?.YES, normalized, 'YES', dateStr, dedupeKey, matchGroupKey, !!debug?.fromCache),
    NO: enrichSourceProof(m.sourceProof?.NO, normalized, 'NO', dateStr, dedupeKey, matchGroupKey, !!debug?.fromCache)
  };
  return normalized;
}

async function fetchParlay({ forceFresh = false, includeProps = false } = {}) {
  const cacheKey = includeProps ? 'parlayMarketsCacheProps' : 'parlayMarketsCache';
  const cacheAtKey = includeProps ? 'parlayMarketsCachePropsAt' : 'parlayMarketsCacheAt';
  const cached = localStorage.getItem(cacheKey);
  const cachedAt = Number(localStorage.getItem(cacheAtKey) || 0);
  const fiveMin = 5 * 60 * 1000;

  const normalizeRaw = (raw, meta = {}) => {
    const debug = {
      rawCount: raw.length,
      normalizedCount: 0,
      fromCache: !!meta.fromCache,
      booksSeen: meta.booksSeen || [...new Set(raw.map(m => m.platform).filter(Boolean))].sort(),
      dropped: {},
      samples: {},
      byBook: {},
      bySport: {},
      backendDiagnostics: meta.backendDiagnostics || null,
      backendCreditEstimate: meta.backendCreditEstimate || null,
      backendResponseMs: meta.backendResponseMs || null,
      matchedPairs: 0,
      arbOrNearPairs: 0
    };
    const normalized = [];
    raw.forEach(m => {
      const n = extractParlayStructure(m, debug);
      if (!n) return;
      normalized.push(n);
      debug.byBook[n.platform] = (debug.byBook[n.platform] || 0) + 1;
      debug.bySport[n.sport] = (debug.bySport[n.sport] || 0) + 1;
    });
    debug.normalizedCount = normalized.length;
    window.__PARLAY_DEBUG = debug;
    console.debug('[ParlayAPI] normalization debug', debug);
    if (Object.keys(debug.dropped).length) console.table(debug.dropped);
    return normalized;
  };

  if (!forceFresh && cached && cachedAt && Date.now() - cachedAt < fiveMin) {
    try { return normalizeRaw(JSON.parse(cached), { fromCache: true }); } catch (_) {}
  }

  const qs = includeProps ? '?props=1' : '';
  const freshQs = includeProps ? '?fresh=1&props=1' : '?fresh=1';
  const data = forceFresh ? await fetchRaw('/api/parlay' + freshQs) : await fetchCachedRaw('/api/parlay' + qs);
  const raw = data.markets || (Array.isArray(data) ? data : []);
  localStorage.setItem(cacheKey, JSON.stringify(raw));
  localStorage.setItem(cacheAtKey, String(Date.now()));
  return normalizeRaw(raw, {
    booksSeen: data.booksSeen || null,
    backendDiagnostics: data.sportsbookDiagnostics || null,
    backendCreditEstimate: data.creditEstimate || null,
    backendResponseMs: data.responseMs || null
  });
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
const fmt    = (n, d=2) => (+n).toFixed(d);
const fmtUSD = n => '$' + fmt(n, 2);
const fmtPct = n => fmt(n, 2) + '%';

function countByPlatform(markets) {
  return (markets || []).reduce((acc, m) => {
    const key = m.platform || 'unknown';
    acc[key] = (acc[key] || 0) + 1;
    return acc;
  }, {});
}

function platformPairKey(a, b) {
  return [a, b].sort().join(' vs ');
}

function countPairsByPlatform(pairs) {
  return (pairs || []).reduce((acc, [a, b]) => {
    const key = platformPairKey(a.platform, b.platform);
    acc[key] = (acc[key] || 0) + 1;
    return acc;
  }, {});
}

function countOppsByPlatform(opps) {
  return (opps || []).reduce((acc, opp) => {
    const key = platformPairKey(opp.legA.platform, opp.legB.platform);
    acc[key] = (acc[key] || 0) + 1;
    return acc;
  }, {});
}

function opportunityPlatforms(opp) {
  return [...new Set([
    opp?.legA?.platform,
    opp?.legB?.platform,
    ...((opp?.sideBoards?.legA || []).map(book => book.platform)),
    ...((opp?.sideBoards?.legB || []).map(book => book.platform))
  ].filter(Boolean))];
}

function topEntries(obj, limit = 20) {
  return Object.entries(obj || {})
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .slice(0, limit);
}

function involvesPlatformSet(opp, set) {
  return set.has(opp.legA.platform) || set.has(opp.legB.platform);
}

function bothPlatformsInSet(opp, set) {
  return set.has(opp.legA.platform) && set.has(opp.legB.platform);
}

function legSideKey(leg) {
  return canonicalSideIdentity(leg);
}

function canonicalSideIdentity(leg) {
  const label = displayBetLabel(leg).toLowerCase().replace(/\s+/g, ' ').trim();
  const marketType = leg?.sourceProof?.normalizedMarketType || leg?.marketType || '';
  const sport = leg?.sport || String(leg?.sourceProof?.normalizedGameKey || '').split('-')[0] || '';
  const line = leg?.sourceProof?.normalizedLine ?? leg?.line ?? '';

  if (marketType === 'moneyline') {
    const teamText = label.replace(/\s+moneyline$/i, '').trim();
    const abbr = teamNameToAbbr(teamText, sport);
    return `moneyline:${abbr || teamText}`;
  }
  if (marketType === 'spread') {
    const side = label.replace(/\s+[+-]?[\d.]+$/i, '').trim();
    const sideLine = (label.match(/([+-]?[\d.]+)$/) || [null, line])[1];
    const abbr = teamNameToAbbr(side, sport);
    return `spread:${abbr || side}:${Number(sideLine)}`;
  }
  if (marketType === 'total') {
    const ou = /^over\b/i.test(label) ? 'over' : /^under\b/i.test(label) ? 'under' : label;
    return `total:${ou}:${Number(line)}`;
  }
  if (marketType === 'prop') {
    const ou = /^over\b/i.test(label) || /\bover\b/i.test(label) ? 'over'
      : /^under\b/i.test(label) || /\bunder\b/i.test(label) ? 'under'
      : label;
    return `prop:${leg?.player || ''}:${leg?.statType || ''}:${Number(line)}:${ou}`;
  }
  return label;
}

function groupedOppKey(opp) {
  const sides = [legSideKey(opp.legA), legSideKey(opp.legB)].sort().join(' vs ');
  const gameKey = opp.matchValidation?.legA?.gameKey || opp.matchValidation?.legB?.gameKey || opp.matchGroupKey || '';
  const line = opp.matchValidation?.legA?.line ?? opp.matchValidation?.legB?.line ?? '';
  return [
    gameKey,
    opp.sport,
    opp.marketType,
    opp.lineType || 'main',
    line,
    opp.gameDate || '',
    sides
  ].map(v => String(v || '').toLowerCase().replace(/\s+/g, ' ').trim()).join('|');
}

function marketMatchesGroupedOpp(market, opp) {
  const validation = opp.matchValidation || {};
  const gameKey = validation.legA?.gameKey || validation.legB?.gameKey;
  const line = validation.legA?.line ?? validation.legB?.line ?? null;
  if (!market || !gameKey || market.gameKey !== gameKey) return false;
  if (market.sport !== opp.sport || market.marketType !== opp.marketType) return false;
  if ((market.lineType || 'main') !== (opp.lineType || 'main')) return false;
  if (opp.marketType === 'moneyline') return market.line == null;
  if (opp.marketType === 'spread' || opp.marketType === 'total') {
    if (market.line == null || line == null) return false;
    return Math.abs(Number(market.line) - Number(line)) <= 0.001;
  }
  if (opp.marketType === 'prop') {
    if (market.line == null || line == null) return false;
    return Math.abs(Number(market.line) - Number(line)) <= 0.001
      && String(market.player || '').toLowerCase() === String(opp.player || opp.legA?.player || '').toLowerCase()
      && String(market.statType || '').toLowerCase() === String(opp.statType || opp.legA?.statType || '').toLowerCase();
  }
  return false;
}

function sidePriceFromMarket(market, outcome) {
  return outcome === 'YES' ? market.yesPrice : market.noPrice;
}

function marketSideLeg(market, outcome) {
  const price = sidePriceFromMarket(market, outcome);
  if (!price) return null;
  const proof = selectedSourceProof(market, outcome, price);
  return {
    platform: market.platform,
    outcome,
    price,
    rawTitle: outcome === 'YES' ? (market.rawTitle || market.noTitle) : (market.noTitle || market.rawTitle),
    sourceProof: proof,
    sport: market.sport,
    gameKey: market.gameKey,
    marketType: market.marketType,
    lineType: market.lineType || 'main',
    line: market.line ?? null,
    player: market.player || null,
    statType: market.statType || null
  };
}

function collectSideBooksFromMarkets(markets, primaryLeg) {
  const primarySide = canonicalSideIdentity(primaryLeg);
  const byPlatform = {};
  (markets || []).forEach(market => {
    ['YES', 'NO'].forEach(outcome => {
      const leg = marketSideLeg(market, outcome);
      if (!leg || canonicalSideIdentity(leg) !== primarySide) return;
      const current = byPlatform[leg.platform];
      if (!current || leg.price < current.price) {
        byPlatform[leg.platform] = leg;
      }
    });
  });
  return Object.values(byPlatform).sort((a, b) => a.price - b.price);
}

function relationToMain(price, mainPrice, platform, mainPlatform) {
  if (platform === mainPlatform) return 'main';
  if (price < mainPrice - 0.0001) return 'better';
  if (price > mainPrice + 0.0001) return 'worse';
  return 'same';
}

function attachSideBoards(primary, allMarkets) {
  const boardMarkets = (allMarkets || []).filter(market => marketMatchesGroupedOpp(market, primary));
  const legABooks = collectSideBooksFromMarkets(boardMarkets, primary.legA);
  const legBBooks = collectSideBooksFromMarkets(boardMarkets, primary.legB);
  const decorate = (books, mainLeg) => books.map(book => ({
    ...book,
    label: displayBetLabel(book),
    relation: relationToMain(book.price, mainLeg.price, book.platform, mainLeg.platform)
  }));
  return {
    legA: decorate(legABooks, primary.legA),
    legB: decorate(legBBooks, primary.legB)
  };
}

function canonicalEventKey(m) {
  const teams = Array.isArray(m?.teams) ? m.teams : [];
  const away = teams[0] || teamNameToAbbr(m?.away || m?.sourceProof?.YES?.rawAwayTeam || m?.sourceProof?.NO?.rawAwayTeam, m?.sport) || '';
  const home = teams[1] || teamNameToAbbr(m?.home || m?.sourceProof?.YES?.rawHomeTeam || m?.sourceProof?.NO?.rawHomeTeam, m?.sport) || '';
  const rawTime = m?.sourceProof?.YES?.rawCommenceTime || m?.sourceProof?.NO?.rawCommenceTime || m?.startTime || null;
  const rawDate = displayLocalDate(rawTime, m?.gameDate || '');
  return [m?.sport || '', away, home, rawDate].map(v => String(v || '').toLowerCase()).join('|');
}

function displayLocalDate(rawTime, fallback = null) {
  return appLocalDate(rawTime, fallback);
}

function isLiveGameTime(rawTime) {
  const startMs = new Date(rawTime || '').getTime();
  if (!Number.isFinite(startMs)) return false;
  const now = Date.now();
  const fiveHours = 5 * 60 * 60 * 1000;
  return now >= startMs && now <= startMs + fiveHours;
}

function canonicalBoardRows(markets) {
  const rows = [];
  (markets || []).forEach(market => {
    if (!['moneyline', 'spread', 'total', 'prop'].includes(market?.marketType)) return;
    ['YES', 'NO'].forEach(outcome => {
      const leg = marketSideLeg(market, outcome);
      if (!leg || !leg.price || leg.price <= 0 || leg.price >= 1) return;
      const proof = leg.sourceProof || {};
      const rawTime = proof.rawCommenceTime || market.startTime || null;
      const eventKey = canonicalEventKey(market);
      const exactBet = displayBetLabel(leg);
      rows.push({
        platform: leg.platform,
        book: PLAT_LB[leg.platform] || leg.platform,
        eventKey,
        gameKey: market.gameKey || null,
        sport: market.sport,
        title: market.teams?.length ? market.teams.map(t => (PM_ABBR[t] || t).toUpperCase()).join(' vs ') : (market.rawTitle || ''),
        gameDate: displayLocalDate(rawTime, market.gameDate || null),
        rawCommenceTime: rawTime,
        marketType: market.marketType,
        lineType: market.lineType || 'main',
        line: market.line ?? null,
        player: market.player || null,
        statType: market.statType || null,
        sideKey: canonicalSideIdentity(leg),
        exactBet,
        outcome,
        price: leg.price,
        american: probToAmerican(leg.price),
        rawTitle: leg.rawTitle,
        sourceProof: proof,
        sourceMarket: market,
        isLive: !!market.isLive || isLiveGameTime(rawTime),
        rawPrice: leg.rawPrice ?? (outcome === 'YES' ? market.rawPrice : market.rawNoPrice) ?? leg.price
      });
    });
  });
  return rows;
}

function boardGroupKey(row) {
  return [
    row.eventKey,
    row.marketType,
    row.lineType || 'main',
    row.line ?? '',
    row.marketType === 'prop' ? row.player || '' : '',
    row.marketType === 'prop' ? row.statType || '' : ''
  ].map(v => String(v || '').toLowerCase()).join('|');
}

function dedupeBoardRows(rows) {
  const best = new Map();
  (rows || []).forEach(row => {
    const key = [row.platform, row.sideKey, row.line ?? ''].join('|');
    const current = best.get(key);
    if (!current || row.price < current.price) best.set(key, row);
  });
  return [...best.values()].sort((a, b) => a.price - b.price || a.platform.localeCompare(b.platform));
}

function bestBoardPair(sideA, sideB) {
  let best = null;
  sideA.forEach(a => {
    sideB.forEach(b => {
      if (a.platform === b.platform) return;
      const sum = a.price + b.price;
      if (!best || sum < best.sum) best = { a, b, sum };
    });
  });
  return best;
}

function boardRowToLeg(row, stake = 0) {
  return {
    platform: row.platform,
    outcome: row.outcome,
    price: row.price,
    stake,
    rawTitle: row.rawTitle,
    rawPrice: row.rawPrice,
    sport: row.sport,
    gameKey: row.gameKey,
    marketType: row.marketType,
    lineType: row.lineType || 'main',
    line: row.line,
    player: row.player || null,
    statType: row.statType || null,
    sourceProof: {
      ...(row.sourceProof || {}),
      displayedBook: row.book,
      displayedMarketType: row.marketType,
      displayedLineType: row.lineType || 'main',
      displayedSide: row.exactBet.replace(/\s+moneyline$/i, ''),
      displayedLine: row.line ?? null,
      displayedOdds: row.american,
      normalizedSide: row.exactBet.replace(/\s+moneyline$/i, ''),
      normalizedProbability: row.price,
      normalizedOdds: row.american,
      normalizedLine: row.line ?? null,
      normalizedLineType: row.lineType || 'main',
      normalizedGameKey: row.eventKey,
      rawCommenceTime: row.rawCommenceTime,
      displayedDate: row.gameDate
    }
  };
}

function boardRowsToOpportunities(boardRows) {
  const groups = new Map();
  boardRows.forEach(row => {
    const key = boardGroupKey(row);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(row);
  });

  const opportunities = [];
  const skipped = {};
  groups.forEach(rows => {
    const bySide = new Map();
    rows.forEach(row => {
      if (!bySide.has(row.sideKey)) bySide.set(row.sideKey, []);
      bySide.get(row.sideKey).push(row);
    });
    if (bySide.size !== 2) {
      skipped.side_count_not_two = (skipped.side_count_not_two || 0) + 1;
      return;
    }
    const [sideAKey, sideBKey] = [...bySide.keys()].sort();
    const sideA = dedupeBoardRows(bySide.get(sideAKey));
    const sideB = dedupeBoardRows(bySide.get(sideBKey));
    const groupIsLive = rows.some(row => row.isLive);
    const best = bestBoardPair(sideA, sideB);
    if (!best) {
      skipped.no_cross_book_pair = (skipped.no_cross_book_pair || 0) + 1;
      return;
    }
    if (best.sum < 0.90 || best.sum > 1.18 || best.a.price < 0.04 || best.b.price < 0.04) return;
    const margin = (1 - best.sum) * 100;
    const isArb = margin > 0;
    const isNear = !isArb && margin > -(NEAR_ARB_BAND * 100);
    if (!isArb && !isNear) return;

    const denom = best.sum;
    const stakeA = BASE_STAKE * best.a.price / denom;
    const stakeB = BASE_STAKE * best.b.price / denom;
    const profit = isArb ? BASE_STAKE * (1 / denom - 1) : 0;
    const title = best.a.marketType === 'prop'
      ? `${best.a.player || 'Player'} ${best.a.statType || 'prop'}`
      : best.a.title || best.b.title || 'MLB market';
    const isAltLine = (best.a.lineType || 'main') === 'alt';
    const lineStr = best.a.line != null ? ` (${isAltLine ? 'alt ' : ''}${best.a.marketType === 'spread' ? 'spread ' : 'O/U '}${best.a.line})` : '';
    const opp = {
      id: `${boardGroupKey(best.a)}::${sideAKey}::${sideBKey}`,
      title: title + lineStr,
      gameDate: best.a.gameDate || best.b.gameDate,
      sport: best.a.sport,
      marketType: best.a.marketType,
      lineType: best.a.lineType || 'main',
      player: best.a.player || null,
      statType: best.a.statType || null,
      legA: boardRowToLeg(best.a, stakeA),
      legB: boardRowToLeg(best.b, stakeB),
      matchGroupKey: boardGroupKey(best.a),
      matchValidation: {
        passed: true,
        marketFamily: best.a.marketType,
        lineType: best.a.lineType || 'main',
        source: 'canonical-board',
        legA: { platform: best.a.platform, gameKey: best.a.eventKey, line: best.a.line ?? null, lineType: best.a.lineType || 'main', side: best.a.exactBet },
        legB: { platform: best.b.platform, gameKey: best.b.eventKey, line: best.b.line ?? null, lineType: best.b.lineType || 'main', side: best.b.exactBet }
      },
      impliedSum: best.sum * 100,
      margin,
      profit,
      roi: isArb ? (1 / denom - 1) * 100 : 0,
      isArb,
      isNear,
      isLive: groupIsLive,
      groupedCount: sideA.length * sideB.length,
      sideBoards: {
        legA: sideA.map(row => ({ ...boardRowToLeg(row), label: row.exactBet, relation: relationToMain(row.price, best.a.price, row.platform, best.a.platform) })),
        legB: sideB.map(row => ({ ...boardRowToLeg(row), label: row.exactBet, relation: relationToMain(row.price, best.b.price, row.platform, best.b.platform) }))
      }
    };
    opportunities.push(opp);
  });

  return { opportunities: opportunities.sort((a, b) => b.margin - a.margin), skipped };
}

function groupOpportunities(opps, allMarkets = []) {
  const groups = new Map();
  (opps || []).forEach(opp => {
    const key = groupedOppKey(opp);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(opp);
  });
  return [...groups.values()].map(group => {
    const primary = [...group].sort((a, b) => b.margin - a.margin)[0];
    return {
      ...primary,
      id: primary.id + '::grouped',
      groupedCount: group.length,
      sideBoards: attachSideBoards(primary, allMarkets)
    };
  }).sort((a, b) => b.margin - a.margin);
}

function probToAmerican(p) {
  if (!p || p <= 0 || p >= 1) return '—';
  return p >= 0.5
    ? '-' + Math.round(p / (1 - p) * 100)
    : '+' + Math.round((1 - p) / p * 100);
}

function cleanTeamLabel(label) {
  const cleaned = String(label || '')
    .replace(/\s+wins\??$/i, '')
    .replace(/\s+winner\??$/i, '')
    .replace(/\?+$/g, '')
    .trim();
  return cleaned.replace(/\b([a-z])/g, ch => ch.toUpperCase())
    .replace(/\bLa\b/g, 'LA')
    .replace(/\bDc\b/g, 'DC');
}

function displayBetLabel(leg) {
  const proof = leg?.sourceProof || {};
  const marketType = proof.displayedMarketType || proof.normalizedMarketType || leg?.marketType || null;
  const line = proof.displayedLine ?? proof.normalizedLine ?? leg?.line ?? null;
  const side = proof.displayedSide || proof.normalizedSide || humanOutcome(leg?.rawTitle, leg?.outcome);

  if (marketType === 'moneyline') {
    const team = cleanTeamLabel(side);
    return team ? `${team} moneyline` : 'Moneyline';
  }

  if (marketType === 'spread') {
    const spread = String(side || '').match(/^(.+?)\s+([+-][\d.]+)$/);
    if (spread) return `${cleanTeamLabel(spread[1])} ${spread[2]}`;
    const titleSpread = String(leg?.rawTitle || '').match(/^Spread:\s+(.+?)\s+\(([+-]?[\d.]+)\)/i);
    if (titleSpread) return `${cleanTeamLabel(titleSpread[1])} ${titleSpread[2]}`;
    return line != null ? `${cleanTeamLabel(side)} ${line}` : cleanTeamLabel(side);
  }

  if (marketType === 'total') {
    if (/^over\b/i.test(side)) return line != null ? `Over ${line}` : side;
    if (/^under\b/i.test(side)) return line != null ? `Under ${line}` : side;
    const ou = String(leg?.rawTitle || '').match(/O\/U\s*([\d.]+)/i);
    if (ou) return leg?.outcome === 'YES' ? `Over ${ou[1]}` : `Under ${ou[1]}`;
    return line != null ? `${leg?.outcome === 'YES' ? 'Over' : 'Under'} ${line}` : side;
  }

  if (marketType === 'prop') {
    const rawPlayer = leg?.player || String(side || '').replace(/\b(over|under)\b.*$/i, '').trim();
    const player = cleanTeamLabel(rawPlayer);
    const stat = String(leg?.statType || '').replace(/^player_/, '').replace(/_/g, ' ');
    const direction = leg?.outcome === 'YES' ? 'Over' : 'Under';
    return `${player} ${direction} ${line} ${stat}`.replace(/\s+/g, ' ').trim();
  }

  return cleanTeamLabel(side) || humanOutcome(leg?.rawTitle, leg?.outcome);
}

function simulateFillPrice(levels, stake) {
  if (!Array.isArray(levels) || !levels.length || !stake || stake <= 0) return null;
  let remaining = stake;
  let shares = 0;
  let spent = 0;
  for (const level of levels) {
    const price = Number(level.price);
    const size = Number(level.size);
    if (!Number.isFinite(price) || !Number.isFinite(size) || price <= 0 || price >= 1 || size <= 0) continue;
    const levelCost = price * size;
    const use = Math.min(remaining, levelCost);
    spent += use;
    shares += use / price;
    remaining -= use;
    if (remaining <= 0.001) break;
  }
  if (spent <= 0 || shares <= 0) return null;
  return spent / shares;
}

function feeAdjustedPrice(rawPrice, feeRate = 0) {
  const p = Number(rawPrice);
  const r = Number(feeRate) || 0;
  if (!Number.isFinite(p) || p <= 0 || p >= 1) return null;
  return p + r * p * (1 - p);
}

function effectiveLegPriceForStake(leg, stake) {
  const stakeNum = Number(stake) || 0;
  const audit = leg?.sourceProof?.priceAudit || leg?.priceAudit || null;
  if (stakeNum > 0 && leg?.platform === 'polymarket' && audit) {
    const levels = leg.outcome === 'NO' ? audit.clobNoAskLevels : audit.clobYesAskLevels;
    const rawFill = simulateFillPrice(levels, stakeNum);
    const adjusted = feeAdjustedPrice(rawFill, audit.feeRate);
    if (adjusted && adjusted > 0 && adjusted < 1) return adjusted;
  }
  if (leg?.platform === 'kalshi' && audit?.rawYesPrice && audit?.rawNoPrice) {
    const levels = leg.outcome === 'NO' ? audit.kalshiNoAskLevels : audit.kalshiYesAskLevels;
    const rawFill = simulateFillPrice(levels, stakeNum);
    const raw = rawFill || (leg.outcome === 'NO' ? Number(audit.rawNoPrice) : Number(audit.rawYesPrice));
    const adjusted = feeAdjustedPrice(raw, 0.07);
    if (adjusted && adjusted > 0 && adjusted < 1) return adjusted;
  }
  return leg?.price || 0;
}

function payoutForStake(leg, stake) {
  const stakeNum = Number(stake) || 0;
  const price = effectiveLegPriceForStake(leg, stakeNum);
  return stakeNum > 0 && price > 0 ? stakeNum / price : 0;
}

function humanOutcome(title, outcome) {
  const t = title || '';
  const sportsbookSpread = t.match(/^Spread:\s+(.+?)\s+\(([+-]?[\d.]+)\)/i);
  if (sportsbookSpread) {
    return `${sportsbookSpread[1].trim()} ${sportsbookSpread[2]}`;
  }
  // Moneyline: "Thunder vs. Suns" YES → "Thunder wins"
  // Moneyline: "Thunder vs. Suns" NO  → "Suns wins"
  const vsM = t.match(/^(.+?)\s+vs\.?\s+(.+?)(\s*:.*)?$/i);
  if (vsM && !t.includes(':')) {
    const teamA = vsM[1].trim();
    const teamB = vsM[2].trim();
    return outcome === 'YES' ? `${teamA} wins` : `${teamB} wins`;
  }
  // Kalshi moneyline: "Game 3: Oklahoma City at Phoenix Winner?" NO → "Phoenix wins"
  const atM = t.match(/(.+?)\s+at\s+(.+?)\s+Winner/i);
  if (atM) {
    const away = atM[1].replace(/^Game\s+\d+:\s*/i, '').trim();
    const home = atM[2].trim();
    return outcome === 'YES' ? `${away} wins` : `${home} wins`;
  }
  // Spread: "Oklahoma City wins by over 9.5 points?" YES → "OKC covers 9.5" NO → "OKC does NOT cover"
  const spreadM = t.match(/^(.+?)\s+wins by over\s+([\d.]+)/i);
  if (spreadM) {
    const team = spreadM[1].trim();
    const line = spreadM[2];
    return outcome === 'YES' ? `${team} covers ${line}` : `${team} does NOT cover ${line}`;
  }
  // Polymarket spread: "Spread: Thunder (-9.5)" YES → "Thunder covers -9.5"
  const pmSpread = t.match(/Spread:\s+(.+?)\s+\(([-\d.]+)\)/i);
  if (pmSpread) {
    return outcome === 'YES' ? `${pmSpread[1]} covers ${pmSpread[2]}` : `${pmSpread[1]} does NOT cover`;
  }
  // Total: "Thunder vs. Suns: O/U 215.5" YES → "Over 215.5" NO → "Under 215.5"
  const ouM = t.match(/O\/U\s*([\d.]+)/i);
  if (ouM) {
    return outcome === 'YES' ? `Over ${ouM[1]}` : `Under ${ouM[1]}`;
  }
  // Kalshi total: "Total Points" YES → "Over the total" NO → "Under the total"
  if (/total points/i.test(t)) {
    return outcome === 'YES' ? 'Over the total' : 'Under the total';
  }
  // Prop: "Kevin Durant: 5+ assists" YES → "Durant gets 5+ assists" NO → "Durant gets fewer than 5"
  const propM = t.match(/^(.+?):\s*([\d.]+)\+\s*(.+)$/i);
  if (propM) {
    const lastName = propM[1].split(' ').pop();
    const num = propM[2];
    const stat = propM[3];
    return outcome === 'YES' ? `${lastName} gets ${num}+ ${stat}` : `${lastName} gets fewer than ${num} ${stat}`;
  }
  // Prop O/U: "Kevin Durant: Assists O/U 4.5" YES → "Durant over 4.5 assists"
  const propOuM = t.match(/^(.+?):\s*(.+?)\s+O\/U\s*([\d.]+)/i);
  if (propOuM) {
    const lastName = propOuM[1].split(' ').pop();
    const stat = propOuM[2];
    const num = propOuM[3];
    return outcome === 'YES' ? `${lastName} over ${num} ${stat}` : `${lastName} under ${num} ${stat}`;
  }
  return outcome === 'YES' ? 'Yes on this outcome' : 'No on this outcome';
}

      return ALL_BOOK_FILTERS;
    }
    try { return JSON.parse(localStorage.getItem('enabledBooks') || 'null') || ALL_BOOK_FILTERS; }
    catch (_) { return ALL_BOOK_FILTERS; }
  });
  const [showNear, setShowNear] = useState(true);
  const [nearOpen, setNearOpen] = useState(true);
  const [firstLoad,setFirst]    = useState(true);
  const [parlayDebug, setParlayDebug] = useState(null);
  const parlayRef = React.useRef([]);
  const kalshiRef = React.useRef([]);

  useEffect(() => {
    setEnabledBooks(prev => {
      const cleaned = prev.filter(b => ALL_BOOK_FILTERS.includes(b));
      return cleaned.length === prev.length ? prev : cleaned;
    });
  }, []);

  useEffect(() => {
    localStorage.setItem('enabledBooks', JSON.stringify(enabledBooks));
  }, [enabledBooks]);

  useEffect(() => {
    localStorage.setItem('includeProps', includeProps ? '1' : '0');
  }, [includeProps]);

  const recalc = useCallback((mkts) => {
    const allStructured = [...mkts.polymarket, ...mkts.kalshi, ...mkts.novig, ...mkts.fliff, ...mkts.parlay];
    const canonicalBoard = canonicalBoardRows(allStructured).filter(row => BOARD_SPORTS.has(row.sport));
    const boardResult = boardRowsToOpportunities(canonicalBoard);
    const boardOpps = boardResult.opportunities;
    const matched = matchMarkets(allStructured);
    setPairs(boardOpps.length);
    const parlayMatchedPairs = matched.filter(([mA, mB]) => mA.source === 'parlay' || mB.source === 'parlay').length;
    const sportsbookSet = new Set(SPORTSBOOK_PLATFORMS);
    const sportsbookPlatformsSeen = [...new Set((mkts.parlay || []).filter(m => sportsbookSet.has(m.platform)).map(m => m.platform))].sort();
    const sportsbookMatchedPairs = boardOpps.filter(opp => opportunityPlatforms(opp).some(platform => sportsbookSet.has(platform))).length;

    let parlayArbOrNearPairs = boardOpps.filter(opp => opportunityPlatforms(opp).some(platform => mkts.parlay.some(m => m.platform === platform))).length;
    let sportsbookArbOrNearPairs = sportsbookMatchedPairs;
    const matchValidationSkips = {};
    matched.forEach(([mA, mB]) => {
      const validation = validateArbMarketPair(mA, mB);
      if (!validation.passed) {
        matchValidationSkips[validation.reason] = (matchValidationSkips[validation.reason] || 0) + 1;
        return;
      }
    });

    const rawValidatedOpps = boardOpps;
    const groupedOpps = boardOpps;
    const groupedArbs = groupedOpps.filter(opp => opp.isArb);
    const groupedNear = groupedOpps.filter(opp => opp.isNear);
    setArbs(groupedArbs);
    setNear(groupedNear);
    const resultOpps = groupedOpps;
    const first20LegProofs = resultOpps.slice(0, 10).flatMap((opp, idx) => ([
      { cardIndex: idx + 1, leg: 'A', platform: opp.legA.platform, outcome: opp.legA.outcome, matchValidation: opp.matchValidation || null, proof: opp.legA.sourceProof || null },
      { cardIndex: idx + 1, leg: 'B', platform: opp.legB.platform, outcome: opp.legB.outcome, matchValidation: opp.matchValidation || null, proof: opp.legB.sourceProof || null }
    ]));
    const debugCounts = {
      coreMarketsByPlatform: {
        polymarket: mkts.polymarket.length,
        kalshi: mkts.kalshi.length,
        novig: mkts.novig.length,
        fliff: mkts.fliff.length
      },
      parlayPlatformsSeen: Object.keys(countByPlatform(mkts.parlay)).sort(),
      sportsbookPlatformsSeen,
      sportsbookMarketsNormalized: (mkts.parlay || []).filter(m => sportsbookSet.has(m.platform)).length,
      sportsbookMatchedPairs,
      sportsbookArbOrNearPairs,
      topMatchedPairsByPlatform: topEntries(countPairsByPlatform(matched), 20),
      topResultCardsByPlatform: topEntries(countOppsByPlatform(resultOpps), 20),
      sportsbookResultCardsTotal: resultOpps.filter(o => opportunityPlatforms(o).some(platform => sportsbookSet.has(platform))).length,
      canonicalBoardRows: canonicalBoard.length,
      canonicalBoardRowsByPlatform: countByPlatform(canonicalBoard),
      canonicalBoardRowsByLineType: countByPlatform(canonicalBoard.map(row => ({ platform: row.lineType || 'main' }))),
      boardSkippedReasons: boardResult.skipped,
      rawValidatedCardsBeforeGrouping: rawValidatedOpps.length,
      groupedCardsAfterGrouping: groupedOpps.length,
      rawArbCardsBeforeGrouping: groupedArbs.length,
      rawNearCardsBeforeGrouping: groupedNear.length,
      groupedArbCards: groupedArbs.length,
      groupedNearCards: groupedNear.length,
      groupedCardsByLineType: countByPlatform(groupedOpps.map(opp => ({ platform: opp.lineType || 'main' }))),
      matchValidationSkips,
      mixedMarketMatchesSkipped: matchValidationSkips.mixed_market_type || 0
    };
    console.debug('[Scanner] first 20 displayed leg source proofs', first20LegProofs);
    if (window.__PARLAY_DEBUG) {
      window.__PARLAY_DEBUG.matchedPairs = parlayMatchedPairs;
      window.__PARLAY_DEBUG.arbOrNearPairs = parlayArbOrNearPairs;
      Object.assign(window.__PARLAY_DEBUG, debugCounts);
      console.debug('[ParlayAPI] match debug', {
        matchedPairsInvolvingParlay: parlayMatchedPairs,
        arbsOrNearArbsInvolvingParlay: parlayArbOrNearPairs,
        ...debugCounts
      });
    }
    return { parlayMatchedPairs, parlayArbOrNearPairs, ...debugCounts };
  }, []);

  const refresh = useCallback(async () => {
    setLoading(true);
    setStatus(prev => ({ ...prev, polymarket:'loading', kalshi:'loading', novig:'legacy', fliff:'loading' }));

    const mkts = { polymarket:[], kalshi: kalshiRef.current || [], novig:[], fliff:[], parlay: parlayRef.current || [] };
    const stat = { polymarket:'idle', kalshi:'idle', novig:'legacy', fliff:'idle', parlay: status.parlay || 'idle' };
    const errs = {};

    await Promise.all([
      fetchPolymarket().then(d => { mkts.polymarket = d; stat.polymarket = 'ok'; }).catch(e => { stat.polymarket = 'error'; errs.polymarket = e.message; }),
      fetchKalshi().then(d => { mkts.kalshi = d; kalshiRef.current = d; stat.kalshi = 'ok'; }).catch(e => {
        stat.kalshi = mkts.kalshi.length ? 'ok' : 'error';
        errs.kalshi = mkts.kalshi.length ? `${e.message}; kept prior Kalshi board` : e.message;
      }),
      fetchFliff().then(d => { mkts.fliff = d; stat.fliff = 'ok'; }).catch(e => { stat.fliff = 'error'; errs.fliff = e.message; }),
    ]);

    setMarkets(mkts);
    setStatus(prev => ({ ...prev, ...stat }));
    setErrors(errs);
    recalc(mkts);
    setLastUp(new Date());
    setLoading(false);
    setFirst(false);
    setCdown(REFRESH_SECS);
    return mkts;
  }, [recalc, status.parlay]);

  const pullParlay = useCallback(async (baseMarkets = markets, pendingParlay = null) => {
    setParlayLoading(true);
    setStatus(prev => ({ ...prev, parlay:'loading' }));
    try {
      const d = await (pendingParlay || fetchParlay({ forceFresh: true, includeProps }));
      if (d.length === 0 && (parlayRef.current || []).length > 0) {
        throw new Error('Sportsbook refresh returned zero markets; keeping previous successful load');
      }
      parlayRef.current = d;
      const next = { ...baseMarkets, parlay: d };
      setMarkets(next);
      setStatus(prev => ({ ...prev, parlay:'ok' }));
      setErrors(prev => { const e = { ...prev }; delete e.parlay; return e; });
      setParlayUp(new Date());
      const matchStats = recalc(next);
      setParlayDebug({ ...(window.__PARLAY_DEBUG || {}), ...matchStats });
      return next;
    } catch (e) {
      setStatus(prev => ({ ...prev, parlay:'error' }));
      setErrors(prev => ({ ...prev, parlay: e.message }));
      return baseMarkets;
    } finally {
      setParlayLoading(false);
    }
  }, [markets, recalc, includeProps]);

  const refreshOdds = useCallback(async () => {
    if (loading || parlayLoading || refreshCooldown) return;
    setRefreshCooldown(true);
    try {
      setParlayLoading(true);
      setStatus(prev => ({ ...prev, parlay:'loading' }));
      const pendingParlay = fetchParlay({ forceFresh: true, includeProps });
      pendingParlay.catch(() => {});
      const coreMarkets = await refresh();
      await pullParlay(coreMarkets, pendingParlay);
    } finally {
      setTimeout(() => setRefreshCooldown(false), 2500);
    }
  }, [loading, parlayLoading, refreshCooldown, refresh, pullParlay]);

  useEffect(() => { refresh(); }, []);
  useEffect(() => {
    const id = setInterval(() => {
      setCdown(c => { if (c <= 1) { refresh(); return REFRESH_SECS; } return c - 1; });
    }, 1000);
    return () => clearInterval(id);
  }, [refresh]);

  const visibleByBooks = (o) => {
    if (enabledBooks.length === ALL_BOOK_FILTERS.length) return true;
    const enabled = new Set(enabledBooks);
    const sideA = (o.sideBoards?.legA?.length ? o.sideBoards.legA : [o.legA]).filter(Boolean);
    const sideB = (o.sideBoards?.legB?.length ? o.sideBoards.legB : [o.legB]).filter(Boolean);
    return sideA.some(a => enabled.has(a.platform) && sideB.some(b => enabled.has(b.platform) && a.platform !== b.platform));
  };
  const visibleByDate = (o) => !todayOnly || o.gameDate === appLocalDate(new Date().toISOString());
  const coreSet = new Set(CORE_PLATFORMS);
  const sportsbookSet = new Set(SPORTSBOOK_PLATFORMS);
  const exchangeSet = new Set(EXCHANGE_PLATFORMS);
  const opportunitySideBooks = (o) => ({
    sideA: (o.sideBoards?.legA?.length ? o.sideBoards.legA : [o.legA]).filter(Boolean),
    sideB: (o.sideBoards?.legB?.length ? o.sideBoards.legB : [o.legB]).filter(Boolean)
  });
  const hasCrossBookPairInSet = (o, platformSet) => {
    const { sideA, sideB } = opportunitySideBooks(o);
    return sideA.some(a =>
      platformSet.has(a.platform) &&
      sideB.some(b => platformSet.has(b.platform) && a.platform !== b.platform)
    );
  };
  const visibleBySource = (o) => {
    if (sourceFilter === 'core') return hasCrossBookPairInSet(o, coreSet);
    if (sourceFilter === 'sportsbook') return hasCrossBookPairInSet(o, sportsbookSet);
    if (sourceFilter === 'exchange') return hasCrossBookPairInSet(o, exchangeSet);
    return true;
  };
  const visibleByMarket = (o) => {
    if (marketFilter === 'main') return (o.lineType || 'main') === 'main' && ['moneyline','spread','total'].includes(o.marketType);
    if (marketFilter === 'props') return o.marketType === 'prop';
    if (['moneyline','spread','total'].includes(marketFilter)) return o.marketType === marketFilter;
    return true;
  };
  const visibleOpp = (o) => visibleByBooks(o) && visibleBySource(o) && visibleByMarket(o) && visibleByDate(o);
  const fArbs = (filter === 'all' ? arbs : arbs.filter(a => a.sport === filter)).filter(visibleOpp);
  const fNear = (filter === 'all' ? near : near.filter(a => a.sport === filter)).filter(visibleOpp);
  const displayArbs = fArbs;
  const displayNear = fNear;
  const shownOpps = [...displayArbs, ...displayNear];
  const shownSportsbookCards = shownOpps.filter(o => opportunityPlatforms(o).some(platform => sportsbookSet.has(platform))).length;
  const shownPairCounts = topEntries(countOppsByPlatform(shownOpps), 20);
  const totalMkts = Object.values(markets).reduce((s,m) => s + m.length, 0);
  const propsLoaded = (markets.parlay || []).some(m => m.marketType === 'prop');
  const allFilteredOpps = [...displayArbs, ...displayNear].sort((a, b) => b.margin - a.margin);
  const bestM = allFilteredOpps.length > 0 ? allFilteredOpps[0].margin : null;
  const totalAvailableOpps = arbs.length + near.length;
  const hiddenLiveArbs = Math.max(0, arbs.length - displayArbs.length);
  const hiddenNearArbs = Math.max(0, near.length - displayNear.length);
  const filtersActive = filter !== 'all' || sourceFilter !== 'all' || marketFilter !== 'all' || todayOnly || enabledBooks.length !== ALL_BOOK_FILTERS.length;
  const hiddenByFilters = totalAvailableOpps > 0 && shownOpps.length === 0;
  const noLiveButNear = displayArbs.length === 0 && displayNear.length > 0;
  const resetFilters = () => {
    setFilter('all');
    setSourceFilter('all');
    setMarketFilter('all');
    setTodayOnly(false);
    setEnabledBooks(ALL_BOOK_FILTERS);
    setShowNear(true);
    setNearOpen(true);
  };

  const toggleBook = (book) => {
    setEnabledBooks(prev => prev.includes(book) ? prev.filter(b => b !== book) : [...prev, book]);
  };

  return (
    <div>
      <div className="hdr">
        <div>
          <div className="hdr-title">LIVE ARB <span>SCANNER</span></div>
          <div className="hdr-sub">The +EV Cave · Prediction Market Arbitrage</div>
        </div>
        <div className="hdr-right">
          {lastUp && (
            <div style={{textAlign:'right'}}>
              <div className="timestamp">Last core refresh {lastUp.toLocaleTimeString()}</div>
              <div className="countdown">free books refresh in {countdown}s</div>
              {parlayUp && <div className="countdown">Last sportsbook refresh {parlayUp.toLocaleTimeString()}</div>}
            </div>
          )}
          <button
            className="btn-refresh"
            onClick={refreshOdds}
            disabled={loading || parlayLoading || refreshCooldown}
            title="Refreshes free books and manually pulls cached sportsbook odds"
          >
            {loading || parlayLoading ? 'Refreshing...' : refreshCooldown ? 'Cooling down...' : 'Refresh Odds'}
          </button>
        </div>
      </div>


      {Object.entries(errors).map(([p,msg]) => (
        <div key={p} className="err-banner"><strong>{PLAT_LB[p] || p}:</strong> {msg}</div>
      ))}

      {!firstLoad && (
        <div className="stats-bar">
          <div className="stat">
            <div className="stat-val" style={{color: displayArbs.length > 0 ? 'var(--green)' : 'var(--dim)'}}>{displayArbs.length}</div>
            <div className="stat-lbl">Live Arbs</div>
          </div>
          <div className="stat">
            <div className="stat-val" style={{color: displayNear.length > 0 ? 'var(--yellow)' : 'var(--dim)'}}>{displayNear.length}</div>
            <div className="stat-lbl">Near-Arbs</div>
          </div>
          <div className="stat">
            <div className="stat-val" style={{color: bestM > 0 ? 'var(--green)' : 'var(--dim)'}}>{bestM != null ? fmtPct(bestM) : '—'}</div>
            <div className="stat-lbl">Best Margin</div>
          </div>
          <div className="stat">
            <div className="stat-val">{totalMkts.toLocaleString()}</div>
            <div className="stat-lbl">Markets Scanned</div>
          </div>
          <div className="stat">
            <div className="stat-val">{pairs.toLocaleString()}</div>
            <div className="stat-lbl">Pairs Matched</div>
          </div>
        </div>
      )}

      <div className="filters">
        {FILTERS.map(f => (
          <button key={f} className={`fbtn${filter===f?' active':''}`} onClick={() => setFilter(f)}>
            {FILTER_LB[f]}
          </button>
        ))}
        <button className={`fbtn${todayOnly?' active':''}`} onClick={() => setTodayOnly(v => !v)}>
          Today Only
        </button>
        <div className="near-toggle" onClick={() => setShowNear(!showNear)}>
          <div className={`tswitch${showNear?' on':''}`}><div className="tknob"/></div>
          Show near-arbs
        </div>
      </div>

      <div className="filters" style={{marginTop:'-10px'}}>
        {SOURCE_FILTERS.map(f => (
          <button key={f} className={`fbtn${sourceFilter===f?' active':''}`} onClick={() => setSourceFilter(f)}>
            {SOURCE_FILTER_LB[f]}
          </button>
        ))}
      </div>

      <div className="filters" style={{marginTop:'-10px'}}>
        {MARKET_FILTERS.map(f => (
          <button key={f} className={`fbtn${marketFilter===f?' active':''}`} onClick={() => setMarketFilter(f)}>
            {MARKET_FILTER_LB[f]}
          </button>
        ))}
        <div className="near-toggle" onClick={() => setIncludeProps(v => {
          const next = !v;
          if (next) {
            setMarketFilter('props');
            setShowNear(true);
            setNearOpen(true);
          }
          return next;
        })} title="Adds player props from ParlayAPI on the next Refresh Odds click">
          <div className={`tswitch${includeProps?' on':''}`}><div className="tknob"/></div>
          Include player props <span style={{color:'var(--dimmer)'}}>+6 credits on refresh</span>
        </div>
      </div>

      <div className="book-filters">
        <div className="book-filter-title">
          Books shown in results
          <div className="book-actions">
            <button className="tiny-btn" onClick={() => setEnabledBooks(ALL_BOOK_FILTERS)}>All</button>
            <button className="tiny-btn" onClick={() => setEnabledBooks(CORE_PLATFORMS)}>Core only</button>
            <button className="tiny-btn" onClick={() => setEnabledBooks([])}>Clear</button>
            <button className="tiny-btn" onClick={resetFilters}>Reset filters</button>
          </div>
        </div>
        <div className="book-grid">
          {ALL_BOOK_FILTERS.map(b => {
            const on = enabledBooks.includes(b);
            return <button key={b} className={`book-chip ${on?'on':'off'}`} onClick={() => toggleBook(b)}>{PLAT_LB[b] || b}</button>;
          })}
        </div>
      </div>

      {DEBUG_MODE && parlayDebug && (
        <div className="countdown" style={{margin:'8px 0 18px'}}>
          Parlay debug: raw {parlayDebug.rawCount?.toLocaleString?.() || 0} · normalized {parlayDebug.normalizedCount?.toLocaleString?.() || 0} ·
          missing teams {parlayDebug.dropped?.missing_team_abbreviation || 0} · invalid prices {parlayDebug.dropped?.missing_invalid_prices || 0} ·
          Parlay matched pairs {parlayDebug.parlayMatchedPairs || parlayDebug.matchedPairs || 0} · arbs/near-arbs {parlayDebug.parlayArbOrNearPairs || parlayDebug.arbOrNearPairs || 0}
        </div>
      )}

      {DEBUG_MODE && parlayDebug && (
        <div className="countdown" style={{margin:'-10px 0 18px'}}>
          Sportsbook debug: platforms {(parlayDebug.sportsbookPlatformsSeen || []).join(', ') || 'none'} Â· normalized {parlayDebug.sportsbookMarketsNormalized || 0} Â· matched pairs {parlayDebug.sportsbookMatchedPairs || 0} Â· result cards shown {shownSportsbookCards}
          <br />
          Top matched pairs: {(parlayDebug.topMatchedPairsByPlatform || []).map(([k,v]) => `${k}: ${v}`).join(' | ') || 'none'}
          <br />
          Cards shown by pair: {shownPairCounts.map(([k,v]) => `${k}: ${v}`).join(' | ') || 'none'}
          {parlayDebug.backendDiagnostics && (
            <>
              <br />
              Backend best sportsbook margins: ML {fmtPct(parlayDebug.backendDiagnostics.bestByMarketType?.moneyline?.marginPercent ?? 0)} · spread {fmtPct(parlayDebug.backendDiagnostics.bestByMarketType?.spread?.marginPercent ?? 0)} · total {fmtPct(parlayDebug.backendDiagnostics.bestByMarketType?.total?.marginPercent ?? 0)} · backend {parlayDebug.backendResponseMs || 'n/a'}ms · credits {parlayDebug.backendCreditEstimate || 'n/a'}
            </>
          )}
        </div>
      )}

      {parlayDebug && parlayDebug.sportsbookMarketsNormalized <= 1 && (
        <div className="err-banner" style={{borderColor:'rgba(245,200,66,0.28)', color:'rgba(245,200,66,0.9)', background:'rgba(245,200,66,0.06)'}}>
          Sportsbook feed loaded, but ParlayAPI returned only {parlayDebug.sportsbookMarketsNormalized || 0} sportsbook market{(parlayDebug.sportsbookMarketsNormalized || 0) === 1 ? '' : 's'}. No sportsbook arbs are available right now.
        </div>
      )}

      {parlayDebug && (
        <div className="scan-health">
          <span><strong>Scan health</strong></span>
          <span>sportsbook rows <strong>{parlayDebug.sportsbookMarketsNormalized || 0}</strong></span>
          <span>board rows <strong>{parlayDebug.canonicalBoardRows || 0}</strong></span>
          <span>cards <strong>{parlayDebug.groupedCardsAfterGrouping || totalAvailableOpps || 0}</strong></span>
          <span>true arbs <strong className={displayArbs.length ? 'ok' : ''}>{displayArbs.length}</strong>/<strong>{arbs.length}</strong></span>
          <span>near-arbs <strong className={displayNear.length ? 'warn' : ''}>{displayNear.length}</strong>/<strong>{near.length}</strong></span>
          {filtersActive && <span>hidden by filters <strong>{hiddenLiveArbs}</strong> arbs / <strong>{hiddenNearArbs}</strong> near</span>}
          {filtersActive && <span>active filters <strong>{[filter, sourceFilter, marketFilter, todayOnly ? 'today' : null, enabledBooks.length !== ALL_BOOK_FILTERS.length ? `${enabledBooks.length}/${ALL_BOOK_FILTERS.length} books` : null].filter(Boolean).join(' / ')}</strong></span>}
          <span>sportsbooks <strong>{(parlayDebug.sportsbookPlatformsSeen || []).join(', ') || 'none'}</strong></span>
          <button className="tiny-btn" onClick={resetFilters}>Reset filters</button>
        </div>
      )}

      {filtersActive && hiddenLiveArbs > 0 && (
        <div className="filter-note">
          <span>{hiddenLiveArbs} true arb card{hiddenLiveArbs === 1 ? '' : 's'} are currently hidden by filters.</span>
          <button className="tiny-btn" onClick={resetFilters}>Show all cards</button>
        </div>
      )}

      {includeProps && !propsLoaded && (
        <div className="filter-note">
          <span>Player props are enabled for the next sportsbook pull.</span>
          <button className="tiny-btn" onClick={refreshOdds} disabled={loading || parlayLoading || refreshCooldown}>
            Refresh Odds to load props
          </button>
        </div>
      )}

      {hiddenByFilters && (
        <div className="filter-note">
          <span>{totalAvailableOpps} validated card{totalAvailableOpps === 1 ? '' : 's'} exist, but current filters hide all of them.</span>
          <button className="tiny-btn" onClick={resetFilters}>Show all cards</button>
        </div>
      )}

      {!showNear && near.length > 0 && displayArbs.length === 0 && (
        <div className="filter-note">
          <span>No true arbs are visible, but {near.length} near-arb card{near.length === 1 ? '' : 's'} are available.</span>
          <button className="tiny-btn" onClick={() => { setShowNear(true); setNearOpen(true); }}>Show near-arbs</button>
        </div>
      )}

      {firstLoad && loading ? (
        <div className="cards">{[1,2,3].map(i=><div key={i} className="skel skel-card"/>)}</div>
      ) : (
        <>
          <div className="sec-hdr">
            Live Arbitrage Opportunities
            {displayArbs.length > 0 && <span className="sec-count">{displayArbs.length}</span>}
          </div>

          {displayArbs.length > 0
            ? <div className="cards">{displayArbs.map(o => <ArbCard key={o.id} opp={o} />)}</div>
            : <div className="empty">
                <div className="empty-icon">◎</div>
                <div>{noLiveButNear ? 'No positive arbs after validation. Closest opportunities are below.' : `No arbitrage opportunities${filter !== 'all' ? ` in ${FILTER_LB[filter]}` : ''} right now.`}</div>
                <div style={{marginTop:6,fontSize:'0.7rem',color:'var(--dimmer)'}}>
                  {pairs} pairs matched across {totalMkts.toLocaleString()} markets · {near.length} near-arb card{near.length === 1 ? '' : 's'} · sportsbook odds are manual
                </div>
                {filtersActive && <button className="tiny-btn" onClick={resetFilters} style={{marginTop:10}}>Reset filters</button>}
              </div>
          }

          {showNear && (
            <div className="near-section">
              <button className="near-hdr-btn" onClick={() => setNearOpen(!nearOpen)}>
                <span className={`chev${nearOpen?' open':''}`}>▶</span>
                Near-arbs ({displayNear.length}) — within 5% of profitable
              </button>
              {nearOpen && displayNear.length > 0 && (
                <div className="cards">{displayNear.map(o => <ArbCard key={o.id} opp={o} />)}</div>
              )}
              {nearOpen && displayNear.length === 0 && (
                <div style={{padding:'16px 0',fontSize:'0.72rem',color:'var(--dimmer)'}}>No near-arbs found.</div>
              )}
            </div>
          )}
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
