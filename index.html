function ArbCard({ opp }) {
  const { legA, legB, margin, roi, sport, marketType, title, isNear, impliedSum, gameDate } = opp;
  const [stakeA, setStakeA] = React.useState('');
  const [stakeB, setStakeB] = React.useState('');
  const [activeInput, setActiveInput] = React.useState(null);

  const denom = legA.price + legB.price;

  // When stake A changes, auto-calc stake B for optimal split
  function handleStakeA(val) {
    setStakeA(val);
    setActiveInput('a');
    const n = parseFloat(val);
    if (n > 0) setStakeB((n * legB.price / legA.price).toFixed(2));
    else setStakeB('');
  }

  function handleStakeB(val) {
    setStakeB(val);
    setActiveInput('b');
    const n = parseFloat(val);
    if (n > 0) setStakeA((n * legA.price / legB.price).toFixed(2));
    else setStakeA('');
  }

  function setTotal(total) {
    const sA = (total * legA.price / denom).toFixed(2);
    const sB = (total * legB.price / denom).toFixed(2);
    setStakeA(sA);
    setStakeB(sB);
  }

  const numA = parseFloat(stakeA) || 0;
  const numB = parseFloat(stakeB) || 0;
  const totalStake = numA + numB;
  const retA = numA > 0 ? numA / legA.price : 0;  // total return if leg A wins
  const retB = numB > 0 ? numB / legB.price : 0;  // total return if leg B wins
  const profitIfA = numA > 0 ? retA - totalStake : 0;
  const profitIfB = numB > 0 ? retB - totalStake : 0;
  const isBalanced = numA > 0 && numB > 0 && Math.abs(profitIfA - profitIfB) < 0.10;

  const cls = isNear ? 'card near' : margin > 3 ? 'card strong' : margin > 1 ? 'card decent' : 'card thin';
  const mvCls = isNear ? 'mv-near' : margin > 3 ? 'mv-strong' : margin > 1 ? 'mv-decent' : 'mv-thin';

  return (
    <div className={cls}>
      {/* Header */}
      <div className="card-top">
        <div className="card-tags">
          <span className="cat-tag">{sport.toUpperCase()}</span>
          <span className="type-tag">{marketType.toUpperCase()}</span>
          {!isNear && <span className="roi-tag">ROI {fmt(roi,2)}%</span>}
          {opp.isLive && <span className="cat-tag" style={{background:'#ff3333',color:'#fff',animation:'pulse 1.5s infinite'}}>● LIVE</span>}
        </div>
        <div className="margin-grp">
          <span className={`margin-val ${mvCls}`}>{fmt(margin,2)}%</span>
          {isNear && <span className="near-lbl">near arb</span>}
        </div>
      </div>

      {/* Title + date */}
      <div className="card-title">
        {title}
        {gameDate && <span className="card-date">{new Date(gameDate+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span>}
      </div>

      {/* Legs — OddsJam style */}
      <div className="oj-legs">
        <ArbLeg leg={legA} stake={stakeA} onStakeChange={handleStakeA} label="LEG 1" />
        <div className="oj-vs">VS</div>
        <ArbLeg leg={legB} stake={stakeB} onStakeChange={handleStakeB} label="LEG 2" />
      </div>

      <AlsoAvailable opp={opp} />

      {/* Quick stake buttons */}
      <div className="oj-quick-row">
        <span className="oj-calc-lbl">Quick set total:</span>
        {[50,100,250,500,1000].map(v => (
          <button key={v} className="stake-pill" onClick={() => setTotal(v)}>${v}</button>
        ))}
      </div>

      {/* Profit scenarios */}
      {totalStake > 0 && (
        <div className="oj-scenarios">
          <div className="oj-scenario">
            <span className="oj-scen-lbl">If {PLAT_LB[legA.platform]} wins:</span>
            <span className={profitIfA > 0 ? 'oj-scen-profit' : 'oj-scen-loss'}>
              {profitIfA >= 0 ? '+' : ''}{fmtUSD(profitIfA)}
            </span>
          </div>
          <div className="oj-scenario">
            <span className="oj-scen-lbl">If {PLAT_LB[legB.platform]} wins:</span>
            <span className={profitIfB > 0 ? 'oj-scen-profit' : 'oj-scen-loss'}>
              {profitIfB >= 0 ? '+' : ''}{fmtUSD(profitIfB)}
            </span>
          </div>
          {isBalanced && (
            <div className="oj-guaranteed">
              ✓ Guaranteed profit: <strong>{fmtUSD(Math.min(profitIfA, profitIfB))}</strong>
            </div>
          )}
          {!isBalanced && totalStake > 0 && (
            <div className="oj-unbalanced">Adjust stakes for equal profit on both sides</div>
          )}
        </div>
      )}
    </div>
  );
}

function humanOutcome(title, outcome) {
  const t = title || '';
  // Moneyline: "Thunder vs. Suns" YES → "Thunder wins"
  // Moneyline: "Thunder vs. Suns" NO  → "Suns wins"
  const vsM = t.match(/^(.+?)\s+vs\.?\s+(.+?)(\s*:.*)?$/i);
  if (vsM && !t.includes(':')) {
    const teamA = vsM[1].trim();
    const teamB = vsM[2].trim();
    return outcome === 'YES' ? `${teamA} wins` : `${teamB} wins`;
  }
  // Kalshi moneyline: "Game 3: Oklahoma City at Phoenix Winner?" NO → "Phoenix wins"
  const atM = t.match(/(.+?)\s+at\s+(.+?)\s+Winner/i);
  if (atM) {
    const away = atM[1].replace(/^Game\s+\d+:\s*/i, '').trim();
    const home = atM[2].trim();
    return outcome === 'YES' ? `${away} wins` : `${home} wins`;
  }
  // Spread: "Oklahoma City wins by over 9.5 points?" YES → "OKC covers 9.5" NO → "OKC does NOT cover"
  const spreadM = t.match(/^(.+?)\s+wins by over\s+([\d.]+)/i);
  if (spreadM) {
    const team = spreadM[1].trim();
    const line = spreadM[2];
    return outcome === 'YES' ? `${team} covers ${line}` : `${team} does NOT cover ${line}`;
  }
  // Polymarket spread: "Spread: Thunder (-9.5)" YES → "Thunder covers -9.5"
  const pmSpread = t.match(/Spread:\s+(.+?)\s+\(([-\d.]+)\)/i);
  if (pmSpread) {
    return outcome === 'YES' ? `${pmSpread[1]} covers ${pmSpread[2]}` : `${pmSpread[1]} does NOT cover`;
  }
  // Total: "Thunder vs. Suns: O/U 215.5" YES → "Over 215.5" NO → "Under 215.5"
  const ouM = t.match(/O\/U\s*([\d.]+)/i);
  if (ouM) {
    return outcome === 'YES' ? `Over ${ouM[1]}` : `Under ${ouM[1]}`;
  }
  // Kalshi total: "Total Points" YES → "Over the total" NO → "Under the total"
  if (/total points/i.test(t)) {
    return outcome === 'YES' ? 'Over the total' : 'Under the total';
  }
  // Prop: "Kevin Durant: 5+ assists" YES → "Durant gets 5+ assists" NO → "Durant gets fewer than 5"
  const propM = t.match(/^(.+?):\s*([\d.]+)\+\s*(.+)$/i);
  if (propM) {
    const lastName = propM[1].split(' ').pop();
    const num = propM[2];
    const stat = propM[3];
    return outcome === 'YES' ? `${lastName} gets ${num}+ ${stat}` : `${lastName} gets fewer than ${num} ${stat}`;
  }
  // Prop O/U: "Kevin Durant: Assists O/U 4.5" YES → "Durant over 4.5 assists"
  const propOuM = t.match(/^(.+?):\s*(.+?)\s+O\/U\s*([\d.]+)/i);
  if (propOuM) {
    const lastName = propOuM[1].split(' ').pop();
    const stat = propOuM[2];
    const num = propOuM[3];
    return outcome === 'YES' ? `${lastName} over ${num} ${stat}` : `${lastName} under ${num} ${stat}`;
  }
  return outcome === 'YES' ? 'Yes on this outcome' : 'No on this outcome';
}

function ArbLeg({ leg, stake, onStakeChange, label }) {
  const cls  = PLAT_CLS[leg.platform] || '';
  const amer = probToAmerican(leg.price);
  const dec  = (1/leg.price).toFixed(2) + 'x';
  const numS = parseFloat(stake) || 0;
  const payout = numS > 0 ? numS / leg.price : 0;

  return (
    <div className="oj-leg">
      <div className="oj-leg-header">
        <span className={`oj-plat ${cls}`}>{PLAT_LB[leg.platform]}</span>
        <span className="oj-leg-label">{label}</span>
      </div>

      {/* What you're actually betting on in plain English */}
      <div className="oj-what-bet">
        <span className={`oj-outcome-badge ${leg.outcome === 'YES' ? 'yes-badge' : 'no-badge'}`}>
          {leg.outcome}
        </span>
        <span className="oj-outcome-desc">{humanOutcome(leg.rawTitle, leg.outcome)}</span>
      </div>

      {/* Raw market title for reference */}
      <div className="oj-raw-title">{leg.rawTitle}</div>

      {/* Odds row */}
      <div className="oj-odds">
        <span className="oj-american">{amer}</span>
        <span className="oj-decimal">{dec}</span>
        <span className="oj-cents">{fmt(leg.price*100,1)}¢</span>
      </div>

      {leg.platform === 'prophetx' && leg.exchangeDebug && <ProphetXDebug debug={leg.exchangeDebug} />}

      {/* Stake input */}
      <div className="oj-stake-wrap">
        <span className="oj-stake-label">Stake</span>
        <div className="stake-input-wrap">
          <span className="stake-dollar">$</span>
          <input
            className="stake-input"
            type="number"
            min="0"
            placeholder="0"
            value={stake}
            onChange={e => onStakeChange(e.target.value)}
          />
        </div>
        {numS > 0 && (
          <span className="oj-payout-line">→ win <strong>{fmtUSD(payout)}</strong></span>
        )}
      </div>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [markets,  setMarkets]  = useState({ polymarket:[], kalshi:[], novig:[], fliff:[], parlay:[] });
  const [status,   setStatus]   = useState({ polymarket:'idle', kalshi:'idle', novig:'idle', fliff:'idle', parlay:'idle' });
  const [errors,   setErrors]   = useState({});
  const [arbs,     setArbs]     = useState([]);
  const [near,     setNear]     = useState([]);
  const [pairs,    setPairs]    = useState(0);
  const [loading,  setLoading]  = useState(false);
  const [parlayLoading, setParlayLoading] = useState(false);
  const [refreshCooldown, setRefreshCooldown] = useState(false);
  const [lastUp,   setLastUp]   = useState(null);
  const [parlayUp, setParlayUp] = useState(null);
  const [countdown,setCdown]    = useState(REFRESH_SECS);
  const [filter,   setFilter]   = useState('all');
  const [sourceFilter, setSourceFilter] = useState('all');
  const [marketFilter, setMarketFilter] = useState('all');
  const [includeProps, setIncludeProps] = useState(false);
  const [compactDuplicates, setCompactDuplicates] = useState(false);
  const [enabledBooks, setEnabledBooks] = useState(() => {
    try { return JSON.parse(localStorage.getItem('enabledBooks') || 'null') || ALL_BOOK_FILTERS; }
    catch (_) { return ALL_BOOK_FILTERS; }
  });
  const [showNear, setShowNear] = useState(true);
  const [nearOpen, setNearOpen] = useState(true);
  const [firstLoad,setFirst]    = useState(true);
  const [parlayDebug, setParlayDebug] = useState(null);
  const parlayRef = React.useRef([]);

  useEffect(() => {
    setEnabledBooks(prev => {
      const cleaned = prev.filter(b => ALL_BOOK_FILTERS.includes(b));
      return cleaned.length === prev.length ? prev : cleaned;
    });
  }, []);

  useEffect(() => {
    localStorage.setItem('enabledBooks', JSON.stringify(enabledBooks));
  }, [enabledBooks]);

  const recalc = useCallback((mkts) => {
    const allStructured = [...mkts.polymarket, ...mkts.kalshi, ...mkts.novig, ...mkts.fliff, ...mkts.parlay];
    const matched = matchMarkets(allStructured);
    setPairs(matched.length);
    const parlayMatchedPairs = matched.filter(([mA, mB]) => mA.source === 'parlay' || mB.source === 'parlay').length;
    const sportsbookSet = new Set(SPORTSBOOK_PLATFORMS);
    const sportsbookPlatformsSeen = [...new Set((mkts.parlay || []).filter(m => sportsbookSet.has(m.platform)).map(m => m.platform))].sort();
    const sportsbookMatchedPairs = matched.filter(([mA, mB]) => sportsbookSet.has(mA.platform) || sportsbookSet.has(mB.platform)).length;

    const arbList = [], nearList = [];
    let parlayArbOrNearPairs = 0;
    let sportsbookArbOrNearPairs = 0;
    matched.forEach(([mA, mB]) => {
      const opp = calcArb(mA, mB);
      if (!opp) return;
      if (mA.source === 'parlay' || mB.source === 'parlay') parlayArbOrNearPairs += 1;
      if (sportsbookSet.has(mA.platform) || sportsbookSet.has(mB.platform)) sportsbookArbOrNearPairs += 1;
      if (opp.isArb) arbList.push(opp);
      else if (opp.isNear) nearList.push(opp);
    });

    arbList.sort((a,b) => b.margin - a.margin);
    nearList.sort((a,b) => b.margin - a.margin);
    setArbs(arbList);
    setNear(nearList);
    const resultOpps = [...arbList, ...nearList];
    const debugCounts = {
      coreMarketsByPlatform: {
        polymarket: mkts.polymarket.length,
        kalshi: mkts.kalshi.length,
        novig: mkts.novig.length,
        fliff: mkts.fliff.length
      },
      parlayPlatformsSeen: Object.keys(countByPlatform(mkts.parlay)).sort(),
      sportsbookPlatformsSeen,
      sportsbookMarketsNormalized: (mkts.parlay || []).filter(m => sportsbookSet.has(m.platform)).length,
      sportsbookMatchedPairs,
      sportsbookArbOrNearPairs,
      topMatchedPairsByPlatform: topEntries(countPairsByPlatform(matched), 20),
      topResultCardsByPlatform: topEntries(countOppsByPlatform(resultOpps), 20),
      sportsbookResultCardsTotal: resultOpps.filter(o => involvesPlatformSet(o, sportsbookSet)).length
    };
    if (window.__PARLAY_DEBUG) {
      window.__PARLAY_DEBUG.matchedPairs = parlayMatchedPairs;
      window.__PARLAY_DEBUG.arbOrNearPairs = parlayArbOrNearPairs;
      Object.assign(window.__PARLAY_DEBUG, debugCounts);
      console.debug('[ParlayAPI] match debug', {
        matchedPairsInvolvingParlay: parlayMatchedPairs,
        arbsOrNearArbsInvolvingParlay: parlayArbOrNearPairs,
        ...debugCounts
      });
    }
    return { parlayMatchedPairs, parlayArbOrNearPairs, ...debugCounts };
  }, []);

  const refresh = useCallback(async () => {
    setLoading(true);
    setStatus(prev => ({ ...prev, polymarket:'loading', kalshi:'loading', novig:'loading', fliff:'loading' }));

    const mkts = { polymarket:[], kalshi:[], novig:[], fliff:[], parlay: parlayRef.current || [] };
    const stat = { polymarket:'idle', kalshi:'idle', novig:'idle', fliff:'idle', parlay: status.parlay || 'idle' };
    const errs = {};

    await Promise.all([
      fetchPolymarket().then(d => { mkts.polymarket = d; stat.polymarket = 'ok'; }).catch(e => { stat.polymarket = 'error'; errs.polymarket = e.message; }),
      fetchKalshi().then(d => { mkts.kalshi = d; stat.kalshi = 'ok'; }).catch(e => { stat.kalshi = 'error'; errs.kalshi = e.message; }),
      fetchNovig().then(d => { mkts.novig = d; stat.novig = 'ok'; }).catch(e => { stat.novig = 'error'; errs.novig = e.message; }),
      fetchFliff().then(d => { mkts.fliff = d; stat.fliff = 'ok'; }).catch(e => { stat.fliff = 'error'; errs.fliff = e.message; }),
    ]);

    setMarkets(mkts);
    setStatus(prev => ({ ...prev, ...stat }));
    setErrors(errs);
    recalc(mkts);
    setLastUp(new Date());
    setLoading(false);
    setFirst(false);
    setCdown(REFRESH_SECS);
    return mkts;
  }, [recalc, status.parlay]);

  const pullParlay = useCallback(async (baseMarkets = markets) => {
    setParlayLoading(true);
    setStatus(prev => ({ ...prev, parlay:'loading' }));
    try {
      const d = await fetchParlay({ forceFresh: true, includeProps });
      if (d.length === 0 && (parlayRef.current || []).length > 0) {
        throw new Error('Sportsbook refresh returned zero markets; keeping previous successful load');
      }
      parlayRef.current = d;
      const next = { ...baseMarkets, parlay: d };
      setMarkets(next);
      setStatus(prev => ({ ...prev, parlay:'ok' }));
      setErrors(prev => { const e = { ...prev }; delete e.parlay; return e; });
      setParlayUp(new Date());
      const matchStats = recalc(next);
      setParlayDebug({ ...(window.__PARLAY_DEBUG || {}), ...matchStats });
      return next;
    } catch (e) {
      setStatus(prev => ({ ...prev, parlay:'error' }));
      setErrors(prev => ({ ...prev, parlay: e.message }));
      return baseMarkets;
    } finally {
      setParlayLoading(false);
    }
  }, [markets, recalc, includeProps]);

  const refreshOdds = useCallback(async () => {
    if (loading || parlayLoading || refreshCooldown) return;
    setRefreshCooldown(true);
    try {
      const coreMarkets = await refresh();
      await pullParlay(coreMarkets);
    } finally {
      setTimeout(() => setRefreshCooldown(false), 2500);
    }
  }, [loading, parlayLoading, refreshCooldown, refresh, pullParlay]);

  useEffect(() => { refresh(); }, []);
  useEffect(() => {
    const id = setInterval(() => {
      setCdown(c => { if (c <= 1) { refresh(); return REFRESH_SECS; } return c - 1; });
    }, 1000);
    return () => clearInterval(id);
  }, [refresh]);

  const visibleByBooks = (o) => enabledBooks.includes(o.legA.platform) && enabledBooks.includes(o.legB.platform);
  const coreSet = new Set(CORE_PLATFORMS);
  const sportsbookSet = new Set(SPORTSBOOK_PLATFORMS);
  const exchangeSet = new Set(EXCHANGE_PLATFORMS);
  const visibleBySource = (o) => {
    if (sourceFilter === 'core') return bothPlatformsInSet(o, coreSet);
    if (sourceFilter === 'sportsbook') return involvesPlatformSet(o, sportsbookSet);
    if (sourceFilter === 'exchange') return involvesPlatformSet(o, exchangeSet);
    return true;
  };
  const visibleByMarket = (o) => {
    if (marketFilter === 'main') return ['moneyline','spread','total'].includes(o.marketType);
    if (marketFilter === 'player_props') return o.marketType === 'prop';
    if (['moneyline','spread','total','prop'].includes(marketFilter)) return o.marketType === marketFilter;
    return true;
  };
  const visibleOpp = (o) => visibleByBooks(o) && visibleBySource(o) && visibleByMarket(o);
  const fArbs = (filter === 'all' ? arbs : arbs.filter(a => a.sport === filter)).filter(visibleOpp);
  const fNear = (filter === 'all' ? near : near.filter(a => a.sport === filter)).filter(visibleOpp);
  const displayArbs = compactDuplicates ? groupOpportunities(fArbs) : annotateOpportunities(fArbs);
  const displayNear = compactDuplicates ? groupOpportunities(fNear) : annotateOpportunities(fNear);
  const shownOpps = [...displayArbs, ...displayNear];
  const shownSportsbookCards = shownOpps.filter(o => involvesPlatformSet(o, sportsbookSet)).length;
  const shownPairCounts = topEntries(countOppsByPlatform(shownOpps), 20);
  const totalMkts = Object.values(markets).reduce((s,m) => s + m.length, 0);
  const bestM = displayArbs.length > 0 ? displayArbs[0].margin : null;

  const toggleBook = (book) => {
    setEnabledBooks(prev => prev.includes(book) ? prev.filter(b => b !== book) : [...prev, book]);
  };

  return (
    <div>
      <div className="hdr">
        <div>
          <div className="hdr-title">LIVE ARB <span>SCANNER</span></div>
          <div className="hdr-sub">The +EV Cave · Prediction Market Arbitrage</div>
        </div>
        <div className="hdr-right">
          {lastUp && (
            <div style={{textAlign:'right'}}>
              <div className="timestamp">Last core refresh {lastUp.toLocaleTimeString()}</div>
              <div className="countdown">free books refresh in {countdown}s</div>
              {parlayUp && <div className="countdown">Last sportsbook refresh {parlayUp.toLocaleTimeString()}</div>}
            </div>
          )}
          <button
            className="btn-refresh"
            onClick={refreshOdds}
            disabled={loading || parlayLoading || refreshCooldown}
            title="Refreshes free books and manually pulls cached sportsbook odds"
          >
            {loading || parlayLoading ? 'Refreshing...' : refreshCooldown ? 'Cooling down...' : 'Refresh Odds'}
          </button>
        </div>
      </div>


      {Object.entries(errors).map(([p,msg]) => (
        <div key={p} className="err-banner"><strong>{PLAT_LB[p] || p}:</strong> {msg}</div>
      ))}

      {!firstLoad && (
        <div className="stats-bar">
          <div className="stat">
            <div className="stat-val" style={{color: displayArbs.length > 0 ? 'var(--green)' : 'var(--dim)'}}>{displayArbs.length}</div>
            <div className="stat-lbl">Live Arbs</div>
          </div>
          <div className="stat">
            <div className="stat-val" style={{color: displayNear.length > 0 ? 'var(--yellow)' : 'var(--dim)'}}>{displayNear.length}</div>
            <div className="stat-lbl">Near-Arbs</div>
          </div>
          <div className="stat">
            <div className="stat-val" style={{color: bestM > 0 ? 'var(--green)' : 'var(--dim)'}}>{bestM != null ? fmtPct(bestM) : '—'}</div>
            <div className="stat-lbl">Best Margin</div>
          </div>
          <div className="stat">
            <div className="stat-val">{totalMkts.toLocaleString()}</div>
            <div className="stat-lbl">Markets Scanned</div>
          </div>
          <div className="stat">
            <div className="stat-val">{pairs.toLocaleString()}</div>
            <div className="stat-lbl">Pairs Matched</div>
          </div>
        </div>
      )}

      <div className="filters">
        {FILTERS.map(f => (
          <button key={f} className={`fbtn${filter===f?' active':''}`} onClick={() => setFilter(f)}>
            {FILTER_LB[f]}
          </button>
        ))}
        <div className="near-toggle" onClick={() => setShowNear(!showNear)}>
          <div className={`tswitch${showNear?' on':''}`}><div className="tknob"/></div>
          Show near-arbs
        </div>
        <div className="near-toggle" onClick={() => setCompactDuplicates(!compactDuplicates)}>
          <div className={`tswitch${compactDuplicates?' on':''}`}><div className="tknob"/></div>
          Compact duplicates
        </div>
      </div>

      <div className="filters" style={{marginTop:'-10px'}}>
        {SOURCE_FILTERS.map(f => (
          <button key={f} className={`fbtn${sourceFilter===f?' active':''}`} onClick={() => setSourceFilter(f)}>
            {SOURCE_FILTER_LB[f]}
          </button>
        ))}
        <button className={`fbtn${includeProps?' active':''}`} onClick={() => setIncludeProps(v => !v)}>
          {includeProps ? 'Main Lines + Props' : 'Main Lines'}
        </button>
      </div>

      <div className="filters" style={{marginTop:'-10px'}}>
        {MARKET_FILTERS.map(f => (
          <button key={f} className={`fbtn${marketFilter===f?' active':''}`} onClick={() => setMarketFilter(f)}>
            {MARKET_FILTER_LB[f]}
          </button>
        ))}
      </div>

      <div className="book-filters">
        <div className="book-filter-title">
          Books shown in results
          <div className="book-actions">
            <button className="tiny-btn" onClick={() => setEnabledBooks(ALL_BOOK_FILTERS)}>All</button>
            <button className="tiny-btn" onClick={() => setEnabledBooks(CORE_PLATFORMS)}>Core only</button>
          </div>
        </div>
        <div className="book-grid">
          {ALL_BOOK_FILTERS.map(b => {
            const on = enabledBooks.includes(b);
            return <button key={b} className={`book-chip ${on?'on':'off'}`} onClick={() => toggleBook(b)}>{PLAT_LB[b] || b}</button>;
          })}
        </div>
      </div>

      {DEBUG_MODE && parlayDebug && (
        <div className="countdown" style={{margin:'8px 0 18px'}}>
          Parlay debug: raw {parlayDebug.rawCount?.toLocaleString?.() || 0} · normalized {parlayDebug.normalizedCount?.toLocaleString?.() || 0} ·
          missing teams {parlayDebug.dropped?.missing_team_abbreviation || 0} · invalid prices {parlayDebug.dropped?.missing_invalid_prices || 0} ·
          Parlay matched pairs {parlayDebug.parlayMatchedPairs || parlayDebug.matchedPairs || 0} · arbs/near-arbs {parlayDebug.parlayArbOrNearPairs || parlayDebug.arbOrNearPairs || 0}
        </div>
      )}

      {DEBUG_MODE && parlayDebug && (
        <div className="countdown" style={{margin:'-10px 0 18px'}}>
          Sportsbook debug: platforms {(parlayDebug.sportsbookPlatformsSeen || []).join(', ') || 'none'} Â· normalized {parlayDebug.sportsbookMarketsNormalized || 0} Â· matched pairs {parlayDebug.sportsbookMatchedPairs || 0} Â· result cards shown {shownSportsbookCards}
          <br />
          Top matched pairs: {(parlayDebug.topMatchedPairsByPlatform || []).map(([k,v]) => `${k}: ${v}`).join(' | ') || 'none'}
          <br />
          Cards shown by pair: {shownPairCounts.map(([k,v]) => `${k}: ${v}`).join(' | ') || 'none'}
          {parlayDebug.backendDiagnostics && (
            <>
              <br />
              Backend best sportsbook margins: ML {fmtPct(parlayDebug.backendDiagnostics.bestByMarketType?.moneyline?.marginPercent ?? 0)} · spread {fmtPct(parlayDebug.backendDiagnostics.bestByMarketType?.spread?.marginPercent ?? 0)} · total {fmtPct(parlayDebug.backendDiagnostics.bestByMarketType?.total?.marginPercent ?? 0)} · backend {parlayDebug.backendResponseMs || 'n/a'}ms · credits {parlayDebug.backendCreditEstimate || 'n/a'}
            </>
          )}
        </div>
      )}

      {parlayDebug && parlayDebug.sportsbookMarketsNormalized <= 1 && (
        <div className="err-banner" style={{borderColor:'rgba(245,200,66,0.28)', color:'rgba(245,200,66,0.9)', background:'rgba(245,200,66,0.06)'}}>
          Sportsbook feed loaded, but ParlayAPI returned only {parlayDebug.sportsbookMarketsNormalized || 0} sportsbook market{(parlayDebug.sportsbookMarketsNormalized || 0) === 1 ? '' : 's'}. No sportsbook arbs are available right now.
        </div>
      )}

      {firstLoad && loading ? (
        <div className="cards">{[1,2,3].map(i=><div key={i} className="skel skel-card"/>)}</div>
      ) : (
        <>
          <div className="sec-hdr">
            Live Arbitrage Opportunities
            {displayArbs.length > 0 && <span className="sec-count">{displayArbs.length}</span>}
          </div>

          {displayArbs.length > 0
            ? <div className="cards">{displayArbs.map(o => <ArbCard key={o.id} opp={o} />)}</div>
            : <div className="empty">
                <div className="empty-icon">◎</div>
                <div>No arbitrage opportunities{filter !== 'all' ? ` in ${FILTER_LB[filter]}` : ''} right now.</div>
                <div style={{marginTop:6,fontSize:'0.7rem',color:'var(--dimmer)'}}>
                  {pairs} pairs matched across {totalMkts.toLocaleString()} markets · free books refresh every {REFRESH_SECS}s · sportsbook odds are manual
                </div>
              </div>
          }

          {showNear && (
            <div className="near-section">
              <button className="near-hdr-btn" onClick={() => setNearOpen(!nearOpen)}>
                <span className={`chev${nearOpen?' open':''}`}>▶</span>
                Near-arbs ({displayNear.length}) — within 2% of profitable
              </button>
              {nearOpen && displayNear.length > 0 && (
                <div className="cards">{displayNear.map(o => <ArbCard key={o.id} opp={o} />)}</div>
              )}
              {nearOpen && displayNear.length === 0 && (
                <div style={{padding:'16px 0',fontSize:'0.72rem',color:'var(--dimmer)'}}>No near-arbs found.</div>
              )}
            </div>
          )}
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
